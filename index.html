<head>
<meta charset="UTF-8">

<title>Galgenmännchen (WH)</title>
<style>
:root{--bg:#0f172a;--bg2:#1d4ed8;--card:rgba(255,255,255,.12);--text:#f8fafc;--accent:#facc15;--good:#22c55e;--bad:#ef4444;--muted:#cbd5e1}
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg),var(--bg2));}
.app{width:min(1500px,96vw);margin:auto;padding:18px 0 28px} header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:clamp(2.2rem,4vw,4.8rem);margin:0} .sub{color:var(--muted);font-size:1.15rem}
.actions{display:flex;gap:10px;flex-wrap:wrap} button,select,input{font:inherit}
.btn{border:0;border-radius:16px;padding:13px 18px;font-weight:800;cursor:pointer;background:white;color:#0f172a}
.btn.primary{background:var(--accent)} .btn.good{background:#86efac} .btn.bad{background:#fca5a5}
.grid{display:grid;grid-template-columns:minmax(330px,.9fr) minmax(450px,1.4fr);gap:18px;margin-top:16px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.info{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap} .pill{background:rgba(255,255,255,.14);padding:10px 14px;border-radius:999px;font-weight:800}
svg{width:100%;max-height:470px} .g{stroke:white;stroke-width:10;stroke-linecap:round;fill:none} .part{opacity:0;transition:.25s} .part.show{opacity:1}
.status{min-height:70px;display:grid;place-items:center;text-align:center;font-size:clamp(1.2rem,2vw,2rem);font-weight:900}
.word{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:20px 0;min-height:90px}
.slot{width:clamp(38px,5vw,66px);height:clamp(56px,7vw,88px);border-bottom:6px solid white;display:grid;place-items:center;font-size:clamp(2rem,4vw,4.5rem);font-weight:900}
.space{border:0;width:24px} .hint{text-align:center;color:#dbeafe;font-size:1.25rem;min-height:36px}
.keyboard{display:grid;grid-template-columns:repeat(9,1fr);gap:9px;margin-top:15px} .key{min-height:58px;border:0;border-radius:13px;font-size:1.5rem;font-weight:900;cursor:pointer}
.key.correct{background:#86efac} .key.wrong{background:#fca5a5} .key:disabled{opacity:.5}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px} label{display:block;font-weight:800;margin-bottom:6px}
select,input{width:100%;padding:12px;border:0;border-radius:12px} .custom{display:none;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px} .custom.show{display:grid}
.footer{text-align:center;color:#dbeafe;margin-top:14px} .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden} .piece{position:absolute;top:-20px;width:12px;height:18px;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(max-width:950px){.grid{grid-template-columns:1fr}.keyboard{grid-template-columns:repeat(7,1fr)}}
@media(max-width:620px){.keyboard{grid-template-columns:repeat(5,1fr)}.controls,.custom{grid-template-columns:1fr}}
.timerbox{margin:12px auto;padding:12px;text-align:center;background:#ffffff20;border-radius:18px}.timerdisplay{font-size:clamp(2rem,4vw,3.5rem);font-weight:900}.timerbar{height:15px;background:#334155;border-radius:15px;overflow:hidden}.timerfill{height:100%;width:100%;background:#22c55e}.timerbox.warning{background:#b4530955}.timerbox.warning .timerfill{background:#facc15}.timerbox.expired{background:#ef4444}.timercontrols{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:10px}.timercontrols select{width:auto;padding:7px}.timercontrols button{padding:8px}

:root{--text:#fff;--muted:#e4defe;--accent:#ffe066;--card:#25155de6}
body{background:radial-gradient(ellipse at 15% 0%,#c65ce455,transparent 55%),radial-gradient(ellipse at 90% 5%,#29c8ff66,transparent 55%),linear-gradient(140deg,#38217c,#18133e 75%);font-family:Trebuchet MS,Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff5 1px,transparent 1px);background-size:42px 42px;opacity:.22}
.app{position:relative;width:min(1520px,96vw)}
header{padding:12px 4px}h1{font-size:clamp(2rem,3.6vw,3.8rem);color:#fff5b6;text-shadow:0 4px 0 #7035ac,0 0 35px #ffbf5c66;letter-spacing:-1px}.sub{margin-top:10px;letter-spacing:.16em;text-transform:uppercase;font-size:.9rem;font-weight:900;color:#d9d2ff}
.card{border:2px solid #a68bff66;background:linear-gradient(145deg,#452b79e8,#20194fe8);box-shadow:0 12px 0 #100d2d,0 20px 50px #0005;border-radius:28px}
.grid{grid-template-columns:minmax(300px,.75fr) minmax(450px,1.5fr)}
.btn{box-shadow:0 5px 0 #08052170;transition:transform .12s,filter .12s;min-height:48px}.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}.btn:active{transform:translateY(4px);box-shadow:none}.btn.primary{background:linear-gradient(#fff49a,#ffbd44);color:#412260}.btn:focus-visible,.key:focus-visible,select:focus-visible{outline:4px solid #63e6ff;outline-offset:4px}
.actions{gap:9px}.actions .btn{font-size:.95rem;padding:12px}.pill{background:#160e40aa;border:1px solid #a997f866;color:#dff9ff;font-size:1rem}
svg{max-height:320px;filter:drop-shadow(0 3px 0 #100a32)}.g{stroke:#fff0ad;stroke-width:9}.part.show{animation:partPop .4s ease-out;transform-box:fill-box;transform-origin:center}.part.react{animation:wiggle .45s ease-in-out}
.status{background:#160f38aa;border-radius:16px;min-height:62px;padding:8px;color:#fff3ba;font-size:clamp(1.2rem,2vw,1.8rem)}
.word{gap:7px;margin:18px 0 22px;min-height:85px}.slot{background:linear-gradient(#fff,#e8ddff);color:#39216a;border:2px solid #fff9;border-bottom:6px solid #a987e8;border-radius:12px;width:clamp(32px,3.6vw,57px);height:clamp(49px,5vw,73px);font-size:clamp(1.7rem,3vw,3.1rem);box-shadow:0 5px 0 #120c32}.slot.space{background:none;border:0;box-shadow:none;width:18px}.slot.revealed{animation:tilePop .35s ease-out;background:linear-gradient(#f4ffd8,#aff0ba);color:#185c38;border-bottom-color:#55bd88}
.hint{color:#ece4ff;font-size:1.12rem;min-height:32px}.keyboard{gap:10px}.key{background:linear-gradient(#fff,#e4d9ff);color:#42277b;box-shadow:0 6px 0 #9a7ac6,0 8px 12px #0003;min-height:57px;transition:transform .12s;touch-action:manipulation}.key:hover:not(:disabled){transform:translateY(-3px);background:#fff6be}.key:active:not(:disabled){transform:translateY(5px);box-shadow:none}.key.correct{background:#8cedbd;color:#165c38;box-shadow:0 4px 0 #26805a;animation:tilePop .35s}.key.wrong{background:#f5a8bd;color:#802543;box-shadow:0 4px 0 #ab4564;animation:wiggle .35s}.key:disabled{opacity:.8}
.timerbox{border:2px solid #9b8be54d;background:#16103999}.timerdisplay{font-size:clamp(1.6rem,2.7vw,2.7rem);min-height:54px;display:grid;place-items:center}.timerbox.warning{background:#60421b;border-color:#ffdb69}.timerbox.warning .timerdisplay{color:#fff2a8;animation:pulse .75s infinite}.timerbox.expired{background:#a43068;border-color:#ff9ecd}.timerbox.expired .timerdisplay{font-size:clamp(1.4rem,2.2vw,2.2rem)}.timerfill{transition:width .1s linear;background:linear-gradient(90deg,#3edeb1,#b9ff97)}.timerbar{background:#100c2d}.timercontrols{font-size:.85rem}.timercontrols label{margin:0}.timercontrols select{color:#30205f}.timercontrols .btn{font-size:.85rem}.controls{margin-top:20px}select{background:#f5efff;color:#342060;min-height:48px}.footer{font-size:.9rem;color:#c9b9ef}.celebrate .status{background:#17785b;color:#fff;animation:tilePop .5s}.celebrate h1{color:#fff59c}.piece{border-radius:3px}.showbadge{color:#8eeeff;font-size:.8rem;font-weight:900;letter-spacing:.2em;margin-bottom:8px}

@media(max-width:950px){.grid{grid-template-columns:1fr}svg{max-height:230px}.keyboard{grid-template-columns:repeat(9,1fr)}}
@media(max-width:620px){.keyboard{grid-template-columns:repeat(6,1fr)}.card{padding:14px}.slot{width:32px;height:49px}.actions .btn{font-size:.85rem}h1{letter-spacing:-.5px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

const USED_KEY="galgen_wh_used_v5_neue_begriffe";
function getUsed(){try{return new Set(JSON.parse(localStorage.getItem(USED_KEY)||"[]"))}catch(e){return new Set()}}
function saveUsed(u){try{localStorage.setItem(USED_KEY,JSON.stringify([...u]))}catch(e){alert("Der Browser kann die gespielten Wörter nicht speichern. Bitte lokalen Speicher erlauben.")}}

function tickTimer(){if(finished){stopTimer();return}const left=Math.max(0,deadline-performance.now());if(timerPhase==="wait"){$("timerfill").style.width=left/(Number($("delaySelect").value)*10)+"%";if(left===0){timerPhase="count";deadline=performance.now()+Number($("countSelect").value)*1000;lastBeep=-1;$("timerbox").classList.add("warning")}}else if(timerPhase==="count"){const sec=Math.ceil(left/1000);$("timerfill").style.width=left/(Number($("countSelect").value)*10)+"%";if(sec>0&&sec!==lastBeep){lastBeep=sec;$("timerdisplay").textContent=sec+" Sekunden!";tone(580+(Number($("countSelect").value)-sec)*110,.13,"triangle")}if(left===0){clearInterval(timerHandle);timerHandle=null;timerPhase="expired";$("timerbox").className="timerbox expired";$("timerdisplay").textContent="NÄCHSTER SPIELER!";$("timerfill").style.width="0%";$("status").textContent="Nächster Spieler!";tone(330,.35,"square")}}}
function filteredPool(cat,diff){
 let pool=DATA[cat]||[];
 if(diff==="leicht"){const f=pool.filter(x=>x[0].replace(/ /g,"").length<=9);if(f.length)pool=f}
 if(diff==="schwer"){const f=pool.filter(x=>x[0].replace(/ /g,"").length>=10);if(f.length)pool=f}
 return pool;
}
function drawWord(){
 const cat=category.value,diff=$("difficulty").value; maxErrors=diff==="leicht"?12:diff==="mittel"?10:8;
  const pool=filteredPool(cat,diff),used=getUsed(),available=pool.filter(x=>!used.has(x[0]));
  if(!available.length){$("status").textContent="Alle Wörter dieser Auswahl verbraucht. Kategorie wechseln oder Wortspeicher zurücksetzen.";return false}

}
